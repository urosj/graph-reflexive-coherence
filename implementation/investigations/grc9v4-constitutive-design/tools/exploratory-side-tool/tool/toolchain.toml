schema = "grcv4_explorer_toolchain_v1"

[python]
minimum = "3.11.0"
upper_bound = ""
environment = "<repository>/.venv"
dependency_lock = "tool/python-requirements.lock"
dependency_policy = "shared_repository_venv_fail_on_conflict_no_implicit_upgrade"
execution_policy = "repository_venv_only"
host_python_exception = "create_and_immediately_reexec_bootstrap_only"
iteration0_tested_versions = ["3.12.3"]
planned_conformance_versions = ["3.11", "3.13"]

[node]
minimum = "22.12.0"
managed_version = "22.23.2"
install_root = "tool/.tooling/node"
package_manager = "npm"
package_manager_version = "10.9.8"
frontend_lock = "tool/web/package-lock.json"
global_install_allowed = false
global_execution_allowed = false

[browser]
prebuilt_bundle_requires_node = false
browser_binary_status = "not_admitted_until_iteration_8"

